<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div id="container">
            <h1> Generate a <br>
                <a>random password</a>
            </h1>
            <h3>Never use an insecure password again.</h3>

            <input type="number" id="pass-length" step="1" min="10" max="25" placeholder="Password Lengths (10-25)">
            <p id="length-status"></p>
            <div id="btn-generator">
                <button id="generate-pass" onclick="generatePasswords()">Generate Passwords</button>
                <label id="number-random">
                    <input type="checkbox" name="numbers-randoms" step="1">
                    <span id="mode">Random</span>
                </label>
            </div>
            <div id="separator"></div>

            <div>
                <ul>
                    <li id="generated-pass-one">

                    </li>
                    <li id="generated-pass-two">

                    </li>
                </ul>
            </div>
            <script src="index.js"></script>
        </div>
    </body>
</html>
